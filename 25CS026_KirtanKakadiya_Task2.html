<!DOCTYPE html>
<html>

<head>

    <title>Online Product Order</title>

    <style>

        body {
            font-family: Arial;
            background-color: #eeeeee;
        }

        /* Center the page title. */
        #mainTitle {
            text-align: center;
            color: darkred;
        }

        /* Use the box ID and a valid padding unit. */
        #orderBox {
            width: 450px;
            border: 2px solid black;
            margin: 20px auto;
            padding: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .bill {
            width: 450px;
            border: 2px solid green;
            margin: 20px auto;
            padding: 15px;
        }

        #orderButton {
            padding: 10px;
            background: lightblue;
        }

    </style>

</head>

<body>

<h1 id="mainTitle">Online Product Order</h1>

<div id="orderBox">

    <div class="field">

        <label for="customer">Customer Name:</label>

        <input type="text" id="customer">

    </div>

    <div class="field">

        <label for="product">Select Product:</label>

        <select id="product">

            <option value="">Select Product</option>
            <option value="Laptop">Laptop - Rs. 50000</option>
            <option value="Mobile">Mobile - Rs. 20000</option>
            <option value="Keyboard">Keyboard - Rs. 1500</option>

        </select>

    </div>

    <div class="field">

        <label for="quantity">Quantity:</label>

        <!-- Keep quantity to positive numbers. -->
        <input type="number" id="quantity" min="1">

    </div>

    <!-- Call the correct billing function. -->
    <button id="orderButton" onclick="calculateBill()">
        Generate Bill
    </button>

</div>

<div id="billBox" class="bill">
    Bill will appear here.
</div>

<script>

function calculateBill() {

    // Get the form values from the correct IDs.
    var customer = document.getElementById("customer").value;
    var product = document.getElementById("product").value;
    var quantity = document.getElementById("quantity").value;

    // Stop early if any required value is invalid.
    if (customer == "") {
        alert("Enter Customer Name");
        return;
    }

    if (product == "") {
        alert("Select Product");
        return;
    }

    if (quantity == "" || isNaN(quantity) || Number(quantity) <= 0) {
        alert("Enter a valid Quantity");
        return;
    }

    quantity = Number(quantity);

    // Match the prices shown in the product list.
    var price = 0;

    if (product == "Laptop") {
        price = 50000;
    }

    if (product == "Mobile") {
        price = 20000;
    }

    if (product == "Keyboard") {
        price = 1500;
    }

    // Multiply price by quantity for the final total.
    var total = price * quantity;

    // Allow only the two expected customer types.
    var customerType = prompt("Enter Customer Type: Regular or Premium");

    if (customerType == null || customerType == "") {
        alert("Customer Type is required");
        return;
    }

    if (customerType != "Regular" && customerType != "Premium") {
        alert("Enter Regular or Premium only");
        return;
    }

    // Ask before placing the order.
    var order = confirm("Do you want to place this order?");

    if (order == false) {
        alert("Order cancelled");
        return;
    }

    // Show the bill in the correct output box.
    document.getElementById("billBox").innerHTML =
        "<h2>Order Bill</h2>" +
        "Customer: " + customer +
        "<br>Product: " + product +
        "<br>Price: " + price +
        "<br>Quantity: " + quantity +
        "<br>Total Amount: " + total +
        "<br>Customer Type: " + customerType;

    alert("Order placed successfully");
}

</script>

</body>

</html>
